name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a half-finished deploy leaves the site in
# whatever state the cancelled run reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Work out the base path
        id: base
        # `<user>.github.io/<repo>/` serves under a prefix, a custom domain at
        # the root. `base` is baked in at build time, so decide it here;
        # `public/CNAME` is the same file GitHub reads to keep a domain.
        run: |
          if [ -f public/CNAME ]; then echo "path=/" >> "$GITHUB_OUTPUT"
          else echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"; fi

      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
