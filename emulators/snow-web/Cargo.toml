[package]
name = "snow_web"
description = "A wasm-bindgen wrapper around Snow's emulator core: a Macintosh Plus for a web page."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Stand-alone: not part of Snow's workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Snow, cloned by build.sh into vendor/snow at a pinned commit and patched (patches/).
snow_core = { path = "vendor/snow/core" }
snow_floppy = { path = "vendor/snow/floppy", default-features = false }

wasm-bindgen = "=0.2.108"
js-sys = "0.3"
anyhow = "1"
log = "0.4"
console_error_panic_hook = "0.1"
# wasm32-unknown-unknown: randomness and the clock come from the browser.
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["wasmbind"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
